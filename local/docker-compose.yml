name: flx-development
services:
  db:
    image: ${FLX_DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_DATABASE: flexora
      MARIADB_USER: flexora
      MARIADB_PASSWORD: ${FLX_DB_PASSWORD:?Create local/.env}
      MARIADB_ROOT_PASSWORD: ${FLX_DB_ROOT_PASSWORD:?Create local/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  wordpress:
    image: ${FLX_WORDPRESS_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLX_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: flexora
      WORDPRESS_DB_PASSWORD: ${FLX_DB_PASSWORD}
      WORDPRESS_DB_NAME: flexora
      WORDPRESS_DEBUG: "1"
      FLX_INTEGRATION_PROBE: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wp_data:/var/www/html
      - ../flexora:/var/www/html/wp-content/themes/flexora
      - ../flexora-child-starter:/var/www/html/wp-content/themes/flexora-child-starter
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zz-flx-dev.ini:ro
  cli:
    image: ${FLX_CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: [tools]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: flexora
      WORDPRESS_DB_PASSWORD: ${FLX_DB_PASSWORD}
      WORDPRESS_DB_NAME: flexora
      FLX_URL: ${FLX_URL:-http://localhost:8090}
      FLX_ADMIN_USER: ${FLX_ADMIN_USER}
      FLX_ADMIN_PASSWORD: ${FLX_ADMIN_PASSWORD}
      FLX_ADMIN_EMAIL: ${FLX_ADMIN_EMAIL}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_data:/var/www/html
      - ../flexora:/var/www/html/wp-content/themes/flexora
      - ../flexora-child-starter:/var/www/html/wp-content/themes/flexora-child-starter
      - ../tests:/workspace/tests:ro
      - ./install.sh:/flx-install.sh:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
volumes:
  db_data:
  wp_data:
